name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  # contents: write to attach the .mcpb bundle to the release;
  # id-token: write for npm provenance and MCP Registry OIDC login.
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Pinned: npm >= 11.5.1 supports trusted publishing (OIDC) and falls
      # back to NODE_AUTH_TOKEN when no trusted publisher is configured.
      - run: npm install -g npm@11.21.1
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run smoke

      - name: Check if this version is already published
        id: pub
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          ver=$(node -p "require('./package.json').version")
          if npm view "$name@$ver" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$name@$ver is already on npm; skipping publish (idempotent re-dispatch)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.pub.outputs.skip == 'false'
        run: npm publish --provenance --access public
        env:
          # Remove once a trusted publisher is configured on npmjs.com for
          # this repo/workflow; OIDC is then used and no token is needed.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build Claude Desktop extension (.mcpb)
        run: |
          set -euo pipefail
          ver=$(node -p "require('./package.json').version")
          rm -rf mcpb-build && mkdir mcpb-build
          cp -r dist package.json package-lock.json README.md LICENSE mcpb-build/
          cp mcpb/manifest.json mcpb-build/
          (cd mcpb-build && npm ci --omit=dev --ignore-scripts)
          npx -y @anthropic-ai/mcpb@2.1.2 validate mcpb-build/manifest.json
          npx -y @anthropic-ai/mcpb@2.1.2 pack mcpb-build "local-ai-mcp-${ver}.mcpb"
          echo "VERSION=${ver}" >> "$GITHUB_ENV"

      - name: Attach .mcpb to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${VERSION}" "local-ai-mcp-${VERSION}.mcpb" --clobber

      # Lists this version in the official MCP Registry. Authenticates with the
      # workflow's GitHub OIDC token (io.github.TMHSDigital/* namespace); the
      # registry checks package.json "mcpName" against server.json "name".
      - name: Publish to the MCP Registry
        if: steps.pub.outputs.skip == 'false'
        run: |
          set -euo pipefail
          curl -sfL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
