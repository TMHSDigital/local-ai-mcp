version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Actions are pinned by commit SHA; Dependabot keeps the SHA and the
    # trailing version comment up to date.
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One PR per week for routine updates instead of one per package.
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Hold the TypeScript 5.x line; majors are a deliberate upgrade.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # engines is >=20; do not pull @types/node ahead of the oldest
      # supported runtime.
      - dependency-name: "@types/node"
        versions: [">=23"]
    # zod majors are allowed: the "mcp-tools.json matches the registered
    # tools" test fails if a bump changes any emitted tool schema.
