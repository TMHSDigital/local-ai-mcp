name: Label PRs

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Auto-label by path
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get changed files
        id: changed
        run: |
          FILES=$(gh pr diff ${{ github.event.pull_request.number }} --name-only)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply labels
        run: |
          LABELS=""

          if echo "$FILES" | grep -q "^src/providers/"; then
            LABELS="$LABELS provider"
          fi

          if echo "$FILES" | grep -q "^src/tools/"; then
            LABELS="$LABELS tools"
          fi

          if echo "$FILES" | grep -q "^src/hardware/"; then
            LABELS="$LABELS hardware"
          fi

          if echo "$FILES" | grep -q "^src/__tests__/"; then
            LABELS="$LABELS testing"
          fi

          if echo "$FILES" | grep -qE "^(docs/|README.md|CONTRIBUTING.md)"; then
            LABELS="$LABELS documentation"
          fi

          if echo "$FILES" | grep -q "^\.github/"; then
            LABELS="$LABELS ci"
          fi

          if [ -n "$LABELS" ]; then
            for label in $LABELS; do
              # Create only if missing; never overwrite an existing label's colour.
              gh label create "$label" --color "ededed" 2>/dev/null || true
              gh pr edit ${{ github.event.pull_request.number }} --add-label "$label"
            done
            echo "Applied labels:$LABELS"
          else
            echo "No labels to apply"
          fi
        env:
          FILES: ${{ steps.changed.outputs.files }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
