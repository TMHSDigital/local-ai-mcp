name: Feature request
description: Suggest a new tool or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The workflow or question an agent (or you) can't handle well today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Tool shape, parameters, or behaviour you have in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
