name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch: {}

# Nothing gets write access by default; only the publish job below does.
permissions:
  contents: read

jobs:
  # Installs dependencies (with their lifecycle scripts), runs every check and
  # builds the artifacts. It holds no OIDC token and cannot write to the repo,
  # so code from the dependency tree or the test suite can never publish.
  build:
    # release.yml dispatches this on main; a manual dispatch from any other
    # branch is refused.
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run smoke

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Pack the npm tarball
        run: |
          set -euo pipefail
          mkdir -p out
          npm pack --pack-destination out
          ls -l out

      - name: Build Claude Desktop extension (.mcpb)
        run: |
          set -euo pipefail
          ver="${{ steps.ver.outputs.version }}"
          rm -rf mcpb-build && mkdir mcpb-build
          cp -r dist package.json package-lock.json README.md LICENSE mcpb-build/
          cp mcpb/manifest.json mcpb-build/
          (cd mcpb-build && npm ci --omit=dev --ignore-scripts)
          npx -y @anthropic-ai/mcpb@2.1.2 validate mcpb-build/manifest.json
          npx -y @anthropic-ai/mcpb@2.1.2 pack mcpb-build "out/local-ai-mcp-${ver}.mcpb"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: out/
          if-no-files-found: error
          retention-days: 7

  # Only publishes what build produced. No `npm ci`, no tests, no dependency
  # scripts run here, which is the only place the OIDC token is available.
  publish:
    needs: build
    runs-on: ubuntu-latest
    # Bind publishing to a deployment environment; add required reviewers to
    # it in the repository settings to gate releases on approval.
    environment: release
    permissions:
      # contents: write to attach the .mcpb bundle to the release;
      # id-token: write for npm provenance and MCP Registry OIDC login.
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # Needed for package.json / server.json metadata only; nothing is installed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Pinned: npm >= 11.5.1 is required for trusted publishing (OIDC), which is
      # the only auth this workflow uses (configured on npmjs.com for publish.yml).
      - run: npm install -g npm@11.21.1 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: out

      - name: Check if this version is already published
        id: pub
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          if npm view "$name@$VERSION" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$name@$VERSION is already on npm; skipping publish (idempotent re-dispatch)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.pub.outputs.skip == 'false'
        run: |
          set -euo pipefail
          tgz=$(ls out/*.tgz)
          npm publish "$tgz" --provenance --access public

      - name: Attach .mcpb to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${VERSION}" "out/local-ai-mcp-${VERSION}.mcpb" --clobber

      # Lists this version in the official MCP Registry. Authenticates with the
      # workflow's GitHub OIDC token (io.github.TMHSDigital/* namespace); the
      # registry checks package.json "mcpName" against server.json "name".
      # Gated on the MCP Registry's own state, not on the npm step, so a
      # re-dispatch can finish a listing that failed after npm succeeded.
      - name: Publish to the MCP Registry
        env:
          # From registry_1.8.7_checksums.txt in the upstream release.
          MCP_PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
        run: |
          set -euo pipefail
          name=$(node -p "require('./server.json').name")
          pkg=$(node -p "require('./package.json').name")
          enc=$(node -p "encodeURIComponent(require('./server.json').name)")
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0/servers/${enc}/versions/${VERSION}")
          if [ "$code" = "200" ]; then
            echo "${name}@${VERSION} is already in the MCP Registry; skipping."
            exit 0
          fi
          # The registry validates the npm package, and a fresh npm publish
          # can take a few minutes to become readable. Wait for it.
          for i in $(seq 1 30); do
            if npm view "${pkg}@${VERSION}" version >/dev/null 2>&1; then break; fi
            if [ "$i" = "30" ]; then echo "::error::${pkg}@${VERSION} is not on npm after 10 minutes"; exit 1; fi
            echo "Waiting for ${pkg}@${VERSION} on npm ($i/30)..."
            sleep 20
          done
          curl -sfL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
