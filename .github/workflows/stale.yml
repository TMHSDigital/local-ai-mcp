name: Stale

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          # Issues: only nudge/close ones waiting on the reporter. Triaged
          # backlog (bugs, features, prioritised work, milestones) never closes.
          days-before-issue-stale: 90
          days-before-issue-close: 14
          only-issue-labels: "needs-info"
          exempt-issue-labels: "priority: high,priority: medium,priority: low,bug,feature,enhancement,security,privacy,documentation"
          exempt-all-milestones: true
          stale-issue-message: "This issue has been waiting on more information for 90 days. It will be closed in 14 days unless there is new activity."
          # PRs: unchanged behaviour.
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-message: "This PR has been automatically marked as stale due to inactivity. It will be closed in 7 days if no further activity occurs."
          stale-issue-label: stale
          stale-pr-label: stale
